services:
  comfyui:
    image: ghcr.io/chaochaoxiaoren/mw-comfyui-docker:latest
    container_name: comfyui
    environment:
      COMFY_PORT: 8188
      COMFY_GPU_MODE: lowvram
    ports:
      - "8188:8188"
    volumes:
      # 模型持久化挂载
      - ./models:/ComfyUI/models
      - ./custom_nodes:/ComfyUI/custom_nodes
      - ./output:/ComfyUI/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
