services:
  comfyui:
    image: mw-comfyui:0.0.1
    container_name: comfyui
    ports:
      - "8188:8188"
    volumes:
      # 模型持久化挂载
      - ./models:/ComfyUI/models
      - ./custom_nodes:/ComfyUI/custom_nodes
      - ./output:/ComfyUI/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
